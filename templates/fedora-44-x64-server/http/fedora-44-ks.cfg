#version=F44
ignoredisk --only-use=sda
clearpart --all --initlabel --drives=sda
text --non-interactive
url --url=https://download.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/os/
repo --name=updates --baseurl=https://download.fedoraproject.org/pub/fedora/linux/updates/44/Everything/x86_64/
keyboard --vckeymap=us --xlayouts='us'
lang en_US.UTF-8
network --bootproto=dhcp --ipv6=auto --hostname=fedora44.local --activate
rootpw root
user --name=localuser --groups=wheel --password=password --plaintext
firstboot --disabled
skipx
services --disabled="kdump" --enabled="sshd,qemu-guest-agent"
timezone Etc/UTC --utc
selinux --enforcing
firewall --disabled
part /boot/efi --fstype="efi" --ondisk=sda --size=600 --fsoptions="umask=0077,shortname=winnt"
part /boot --fstype="xfs" --ondisk=sda --size=1024
part / --fstype="xfs" --ondisk=sda --grow --size=6144
reboot --eject

%packages
NetworkManager
openssh-server
sudo
python3
qemu-guest-agent
dnf
kernel
passwd
rootfiles
systemd
vim-minimal
%end

%post --log=/root/ks-post.log
set -eux

echo "localuser ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/localuser
chmod 0440 /etc/sudoers.d/localuser
sed -i "s/^.*requiretty/#Defaults requiretty/" /etc/sudoers || true

mkdir -p /etc/ssh/sshd_config.d
cat > /etc/ssh/sshd_config.d/50-ludus.conf <<EOF
PasswordAuthentication yes
PubkeyAuthentication yes
PermitRootLogin yes
EOF

cat > /etc/sysconfig/network <<EOF
NETWORKING=yes
NOZEROCONF=yes
EOF

mkdir -p /etc/sysconfig/network-scripts
cat > /etc/sysconfig/network-scripts/ifcfg-eth0 <<EOF
TYPE=Ethernet
BOOTPROTO=dhcp
DEFROUTE=yes
IPV4_FAILURE_FATAL=no
IPV6INIT=no
NAME=eth0
DEVICE=eth0
ONBOOT=yes
EOF

cat > /etc/sysctl.d/50-ipv6.conf <<EOF
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.lo.disable_ipv6 = 1
EOF

rm -rf /etc/NetworkManager/system-connections/*
truncate -s 0 /etc/machine-id || true
rm -f /var/lib/dbus/machine-id
rm -f /etc/ssh/ssh_host_*_key /etc/ssh/ssh_host_*_key.pub
dnf clean all || dnf5 clean all || true
rm -rf /tmp/* /var/tmp/* /var/cache/dnf/* /var/log/anaconda /var/log/dnf* /var/log/hawkey.log
truncate -s 0 /var/log/btmp /var/log/wtmp /var/log/lastlog || true
%end
