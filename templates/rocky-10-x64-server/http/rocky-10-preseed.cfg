#version=RHEL10

# Install only to the Packer-created SCSI disk.
ignoredisk --only-use=sda
zerombr
clearpart --all --initlabel --drives=sda

# Installer behavior.
text
cdrom
reboot
firstboot --disabled
skipx

# Additional current Rocky package sources.
repo --name="BaseOS" --baseurl=https://download.rockylinux.org/pub/rocky/10/BaseOS/x86_64/kickstart/
repo --name="AppStream" --baseurl=https://download.rockylinux.org/pub/rocky/10/AppStream/x86_64/kickstart/

# Locale.
keyboard --vckeymap=us --xlayouts='us'
lang en_US.UTF-8
timezone Etc/UTC --utc

# Build-time networking.
network --device=link --bootproto=dhcp --ipv6=auto --hostname=rocky10.local --activate

# Bootstrap identities used only to create and initially configure clones.
rootpw --plaintext root
user --name=localuser --groups=wheel --password=password --plaintext --gecos="Ludus Local User"

# Security baseline for the generic Ludus image.
# AWX will install the permanent management firewall and SSH policy.
firewall --disabled
selinux --enforcing

# Services.
services --disabled="kdump" --enabled="sshd,rsyslog,chronyd,qemu-guest-agent"

# Let Anaconda create a bootable LVM layout appropriate for the firmware.
autopart --type=lvm

bootloader --location=mbr --append="console=tty0 console=ttyS0,115200n8"

%packages --ignoremissing
@^minimal-environment

bash-completion
chrony
curl
git
kexec-tools
openssh-server
openssh-clients
python3
python3-libselinux
qemu-guest-agent
rsync
rsyslog
sudo
tar
tuned
vim

%end

%post --log=/root/rocky10-kickstart-post.log --erroronfail

# Permit Ludus/Packer bootstrap access. The permanent AWX management-access
# workflow is responsible for replacing this configuration after deployment.
install -d -m 0755 /etc/ssh/sshd_config.d

cat >/etc/ssh/sshd_config.d/90-ludus-bootstrap.conf <<'SSHEOF'
PermitRootLogin yes
PasswordAuthentication yes
KbdInteractiveAuthentication yes
UsePAM yes
SSHEOF

# Require the localuser password for sudo during the initial Ludus phase.
install -d -m 0750 /etc/sudoers.d

cat >/etc/sudoers.d/90-ludus-localuser <<'SUDOEOF'
localuser ALL=(ALL) ALL
SUDOEOF

chmod 0440 /etc/sudoers.d/90-ludus-localuser

# Make sure required services start on the first boot.
systemctl enable sshd
systemctl enable chronyd
systemctl enable qemu-guest-agent
systemctl enable rsyslog

# Use the virtualization-aware tuned profile when available.
if command -v tuned-adm >/dev/null 2>&1; then
    tuned-adm profile virtual-guest || true
fi

# Keep /tmp on disk instead of tmpfs for consistency and forensic value.
systemctl mask tmp.mount || true

# This range is currently IPv4-only.
cat >/etc/sysctl.d/50-ludus-ipv6.conf <<'SYSCTLEOF'
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.lo.disable_ipv6 = 1
SYSCTLEOF

# Ensure chronyd and SSH prefer IPv4.
cat >/etc/ssh/sshd_config.d/50-ipv4-only.conf <<'SSHIPV4EOF'
AddressFamily inet
SSHIPV4EOF

if grep -q '^OPTIONS="' /etc/sysconfig/chronyd 2>/dev/null; then
    sed -i 's/^OPTIONS="/OPTIONS="-4 /' /etc/sysconfig/chronyd
fi

# Serial-console support for Proxmox.
mkdir -p /etc/systemd/system/serial-getty@ttyS0.service.d

cat >/etc/systemd/system/serial-getty@ttyS0.service.d/override.conf <<'SERIALEOF'
[Service]
Restart=always
SERIALEOF

systemctl enable serial-getty@ttyS0.service || true

# Apply all updates available at image-build time.
dnf -y update

# Remove stale package and installer state.
dnf clean all
rm -rf /var/cache/dnf/*
rm -rf /var/log/anaconda/*
rm -rf /tmp/*
rm -rf /var/tmp/*
rm -rf /var/lib/systemd/random-seed
rm -rf /var/lib/NetworkManager/*

# Do not retain installer history in the reusable base image.
truncate -s 0 /var/log/messages 2>/dev/null || true
truncate -s 0 /var/log/secure 2>/dev/null || true
truncate -s 0 /var/log/cron 2>/dev/null || true
truncate -s 0 /var/log/wtmp 2>/dev/null || true
truncate -s 0 /var/log/btmp 2>/dev/null || true
truncate -s 0 /var/log/lastlog 2>/dev/null || true

# Rebuild the initramfs after updates and virtualization changes.
dracut -f --regenerate-all

%end
